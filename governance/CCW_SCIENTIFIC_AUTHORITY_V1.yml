# 下列约束直接来自本次任务，不代表研究方案或统计方法已获批准。
task_constraints:
  analysis_ready_inputs_only: true
  database_connection_allowed: false
  sql_generation_allowed: false
  result_dependent_specification_changes_allowed: false
  clone_independence_assumption_allowed: false
  bootstrap_resampling_unit: "original_subject"
  bootstrap_preserve_all_related_analysis_units_and_clones: true
  bootstrap_refit_all_required_models: true
  fixed_weight_bootstrap_equivalence_claim_allowed: false
  competing_event_as_ordinary_censoring_for_cause_specific_cif_allowed: false
  production_registry_update_allowed_in_this_stage: false
  automatic_merge_or_release_allowed: false

