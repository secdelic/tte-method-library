name: optional-word-reporting

on:
  push:
    paths:
      - reporting/**
      - runtime/render_report.py
      - tests/test_word_reporting.py
      - examples/word_reporting/**
      - validation/fixtures/mi_effects.csv
      - examples/quick_start/expected/tables_primary_effects.csv
      - .github/workflows/word-reporting.yml
  pull_request:
    paths:
      - reporting/**
      - runtime/render_report.py
      - tests/test_word_reporting.py
      - examples/word_reporting/**
      - validation/fixtures/mi_effects.csv
      - examples/quick_start/expected/tables_primary_effects.csv
      - .github/workflows/word-reporting.yml

permissions:
  contents: read

jobs:
  document-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional reporting dependencies
        run: python -m pip install -r reporting/requirements.txt
      - name: Reporting input and document contracts
        run: python -m unittest discover -s tests -p test_word_reporting.py -v
