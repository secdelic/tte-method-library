name: public-rc1-validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - name: Install lockfile system requirements
        run: |
          sudo apt-get install -y cmake libcurl4-openssl-dev libglpk-dev libnode-dev libx11-dev pandoc
      - uses: r-lib/actions/setup-renv@v2
      - name: Parse R sources
        run: Rscript -e 'files <- list.files(".", pattern="[.]R$", recursive=TRUE, full.names=TRUE); invisible(lapply(files, parse)); cat("R_PARSE=PASS\n")'
      - name: Tests
        run: Rscript tests/run_tests.R
      - name: Production Quick Start
        run: Rscript examples/quick_start/run_quick_start.R
      - name: Numerical and independent validation
        run: Rscript validation/run_public_numerical_regression.R
      - name: Metadata and documentation
        run: |
          Rscript validation/validate_metadata.R
          Rscript validation/validate_documentation_links.R
      - name: CITATION.cff schema
        run: |
          python -m pip install --disable-pip-version-check cffconvert==2.0.0
          cffconvert --validate
      - name: Privacy, secrets, identifiers, and private governance
        run: Rscript validation/scan_public_repository.R
      - name: Release dry run
        run: Rscript validation/release_dry_run.R
